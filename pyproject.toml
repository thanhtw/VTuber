[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-nlp"
version = "0.1.0"
description = "YouTube metadata topic modeling and comment sentiment analysis"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "python-dotenv>=1,<2", "nltk>=3.9,<4", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
research = ["gensim>=4.4,<5", "networkx>=3.2,<4", "transformers>=4.45,<5", "torch>=2.2,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
youtube-nlp = "youtube_nlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
